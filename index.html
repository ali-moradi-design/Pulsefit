<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Pulsefit: an offline-first workout and diet tracker for coaches and athletes."
    />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Pulsefit</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('pulsefit-settings') || '{}')
        if (s.state && s.state.theme) document.documentElement.dataset.theme = s.state.theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
