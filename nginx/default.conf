# Nginx inside the container: serves the static build (dist). The host Nginx in front
# of it terminates TLS (deploy/nginx.conf). There is no backend: the /api/ routes are
# answered by the service worker in the browser (src/app/sw/mock-server.ts).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # behind a proxy the host name in redirects would be wrong; keep them relative
    absolute_redirect off;

    # Files were gzipped at build time (Dockerfile): send the .gz copy when the
    # browser accepts it, so nothing is compressed per request.
    gzip_static on;
    gzip_vary on;

    # The app only ever needs GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles or source maps.
    location ~ /\.      { return 404; }
    location ~ \.map$   { return 404; }

    # Hashed build output (JS, CSS, fonts): cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker and the files that decide which version runs must always
    # be checked with the server, or an update could stay hidden for a long time.
    location ~ ^/(sw\.js|index\.html|offline\.html|theme-init\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Exercise and food libraries: not hashed; the service worker refreshes them
    # in the background (stale-while-revalidate), so a short cache is enough.
    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Icons, screenshots, favicon: not hashed, a long but not immutable cache.
    location ~ ^/(icons|screenshots)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The mock API lives in the service worker. Without it (first visit, worker not
    # active yet) answer 404 instead of the SPA page.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
